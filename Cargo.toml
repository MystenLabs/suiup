[package]
name = "suiup"
description = "Sui Tooling Version Manager."
version = "0.0.14"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
colored = "3.1.1"
comfy-table = "8.0.0"
console = { version = "0.16", features = ["windows-console-colors"] }
dirs = "6.0.0"
env_logger = "0.11.11"
log = "0.4.34"
flate2 = "1.1.10"
futures-util = "0.3.34"
indicatif = "0.18"
lazy_static = "1.5.0"
regex = "1.13.1"
md5 = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "stream", "rustls"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
tar = "0.4.46"
tempfile = "3.27"
filetime = "0.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = { version = "0.1.44", features = ["log"] }
whoami = "2.1.3"

[dev-dependencies]
assert_cmd = "2.2"
mockall = "0.15.0"
predicates = "3.1"

[profile.test]
inherits = "release"
